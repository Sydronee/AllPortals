<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllPortals Collaborative Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --success: #22c55e;
            --danger: #ef4444;
            --warn: #f59e0b;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        h1, h2 { margin-top: 0; font-size: 1.5rem; color: var(--accent); }
        h2 { font-size: 1.15rem; margin-bottom: 10px; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .topbar h1 { margin: 0; }
        .who { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); padding: 12px; border-radius: 8px; }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); }
        .stat-value { font-size: 1.25rem; font-weight: bold; margin-top: 4px; }
        .stat-note { font-size: 0.8rem; color: var(--warn); margin-top: 4px; }
        .target-card {
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--accent);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .target-card p { margin: 6px 0; }
        .coords { font-size: 1.3rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        .teammate {
            display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
            border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .teammate .muted { color: var(--text-muted); }
        .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-size: 0.9rem; color: var(--text-muted); }
        input, select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
        }
        input:focus, select:focus { outline: 1px solid var(--accent); }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button {
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
            font-size: 0.95rem;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button.secondary { background-color: #475569; color: white; }
        button.secondary:hover:not(:disabled) { background-color: #334155; }
        button.danger { background-color: var(--danger); color: white; }
        details { border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-top: 12px; }
        details summary { cursor: pointer; color: var(--text-muted); font-size: 0.9rem; }
        details form { margin-top: 12px; }
        .map-container { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--border); background: white; }
        .legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 12px 0 0; font-size: 0.85rem; color: var(--text-muted); }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .fun-fact { margin-top: 12px; font-style: italic; color: var(--text-muted); font-size: 0.9rem; }
        .ring-progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 20px; }
        .ring { border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; font-size: 0.85rem; }
        .ring.found { color: var(--success); border-color: var(--success); background: rgb(34 197 94 / 0.12); }
        .log { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; font-size: 0.85rem; }
        .log li { padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-muted); }
        .log time { color: var(--text-color); margin-right: 6px; font-variant-numeric: tabular-nums; }
        .spinner {
            display: inline-block; width: 0.9em; height: 0.9em; margin-right: 6px; vertical-align: -0.1em;
            border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .join-panel { border: 1px dashed var(--accent); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .toast {
            position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
            background: var(--danger); color: white; padding: 10px 16px; border-radius: 8px;
            font-size: 0.9rem; max-width: 90vw; box-shadow: 0 4px 12px rgb(0 0 0 / 0.4);
        }
        .toast[hidden], [hidden] { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    </style>
</head>
<body>

<div class="container">
    <!-- Left column: controls and stats -->
    <div class="card">
        <div class="topbar">
            <h1>AllPortals Navigator</h1>
            <div class="who" id="who" hidden>
                <label for="player-select" class="sr-only">Playing as</label>
                <span>Playing as</span>
                <select id="player-select" style="width: auto;"></select>
            </div>
        </div>

        <div class="join-panel" id="join-panel" hidden>
            <h2>Join the run</h2>
            <form id="join-form">
                <label for="join-name">Your name (up to 20 letters or digits)</label>
                <input type="text" id="join-name" maxlength="20" required autocomplete="nickname" placeholder="e.g. Syd">
                <button type="submit">Join</button>
            </form>
        </div>

        <div class="stat-grid">
            <div class="stat-box">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completed-count">0 / 128</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Solver Status</div>
                <div class="stat-value" id="solver-status" style="color: var(--danger);">Unsolved</div>
                <div class="stat-note" id="solver-note" hidden></div>
            </div>
        </div>

        <div class="target-card" id="target-section">
            <h2>Your target</h2>
            <div id="target-details">Loading state...</div>
            <div class="btn-group" id="target-actions" hidden>
                <button id="btn-complete">Found it</button>
                <button id="btn-skip" class="secondary">Empty sector</button>
            </div>
        </div>

        <div id="team-area" aria-live="polite"></div>

        <h2>Ring Progress</h2>
        <div class="ring-progress" id="ring-progress" aria-live="polite"></div>

        <div id="ring-section">
            <h2>Log a ring stronghold</h2>
            <form id="ring-form">
                <div class="row">
                    <div>
                        <label for="ring-x">Overworld X</label>
                        <input type="number" id="ring-x" required placeholder="e.g. 2048">
                    </div>
                    <div>
                        <label for="ring-z">Overworld Z</label>
                        <input type="number" id="ring-z" required placeholder="e.g. 0">
                    </div>
                </div>
                <button type="submit">Submit ring coordinate</button>
            </form>
        </div>

        <div class="btn-group">
            <button id="btn-undo" class="secondary" disabled>Undo last action</button>
            <button id="btn-replan" class="secondary" disabled>Re-plan route</button>
        </div>

        <details>
            <summary>I died / moved: reset my position</summary>
            <form id="reset-form">
                <label for="reset-paste">Paste F3+C here (optional)</label>
                <input type="text" id="reset-paste" placeholder="/execute in minecraft:overworld run tp @s ..." autocomplete="off">
                <div class="row">
                    <div>
                        <label for="reset-x">X</label>
                        <input type="number" id="reset-x" value="0" required>
                    </div>
                    <div>
                        <label for="reset-z">Z</label>
                        <input type="number" id="reset-z" value="0" required>
                    </div>
                </div>
                <button type="submit" class="secondary">Reset position and re-plan</button>
            </form>
        </details>

        <details>
            <summary>Correct the completed count</summary>
            <form id="count-form">
                <label for="count-value">Completed strongholds (0 to 128)</label>
                <input type="number" id="count-value" min="0" max="128" required>
                <button type="submit" class="danger">Set count</button>
            </form>
        </details>

        <h2 style="margin-top: 20px;">Activity</h2>
        <ul class="log" id="log" aria-live="polite"></ul>
    </div>

    <!-- Right column: live map -->
    <div class="card map-container">
        <h2>Live Map</h2>
        <img id="map-image" src="" alt="AllPortals route map showing every stronghold and each player's route">
        <div class="legend" id="legend"></div>
        <div class="legend">
            <span><i class="dot" style="background:#22c55e"></i>Found</span>
            <span><i class="dot" style="background:#ef4444"></i>Empty sector</span>
            <span><i class="dot" style="background:#9ca3af"></i>Not visited</span>
        </div>
        <div class="fun-fact" id="fun-fact-text"></div>
    </div>
</div>

<div class="toast" id="toast" role="alert" hidden></div>

<script>
    const $ = (id) => document.getElementById(id);
    const POLL_MS = 1500;
    let latest = null;
    let me = localStorage.getItem('ap_player') || '';
    let renderedVersion = null;
    let renderedMe = null;
    let busy = false;
    let toastTimer = null;

    function esc(text) {
        const div = document.createElement('div');
        div.textContent = String(text ?? '');
        return div.innerHTML;
    }

    function showError(message) {
        const toast = $('toast');
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
    }

    async function api(url, payload, method = 'POST') {
        if (busy) return;
        busy = true;
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: payload === undefined ? undefined : JSON.stringify(payload),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                const detail = Array.isArray(data.detail) ? 'Check the values you entered' : data.detail;
                showError(detail || `Request failed (${res.status})`);
                return null;
            }
            render(data, true);
            return data;
        } catch (err) {
            showError('Could not reach the server');
            return null;
        } finally {
            busy = false;
        }
    }

    async function poll() {
        try {
            const res = await fetch('/api/state');
            if (res.status === 401) { showError('Not authorised: open the link with ?token=...'); return; }
            if (res.ok) render(await res.json());
        } catch (err) {
            console.error('Failed to fetch state:', err);
        }
    }

    function myPlayer(data) {
        return data.players.find((p) => p.name.toLowerCase() === me.toLowerCase()) || null;
    }

    function formatLog(entry) {
        const verbs = { complete: 'found', skip: 'skipped', ring: 'logged' };
        const who = entry.player || 'Someone';
        const text = [who, verbs[entry.action], entry.detail].filter(Boolean).join(' ');
        const time = new Date(entry.t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `<li><time>${esc(time)}</time>${esc(text)}</li>`;
    }

    function targetBlock(target) {
        const ow = target.overworld, nether = target.nether;
        return `
            <p class="coords">${ow.x}, ${ow.z}</p>
            <p><strong>Nether:</strong> ${nether.x}, ${nether.z}</p>
            <p><strong>Ring ${target.ring}</strong> &middot; ${Math.round(target.distance)} blocks &middot; face ${target.angle}&deg;</p>`;
    }

    function render(data, force = false) {
        latest = data;
        const mine = myPlayer(data);
        if (!force && data.version === renderedVersion && me === renderedMe) return;
        renderedVersion = data.version;
        renderedMe = me;
        if (mine) me = mine.name;

        // Who am I?
        $('join-panel').hidden = Boolean(mine);
        $('who').hidden = data.players.length === 0;
        const select = $('player-select');
        select.innerHTML = data.players.map((p) =>
            `<option value="${esc(p.name)}" ${mine && p.name === mine.name ? 'selected' : ''}>${esc(p.name)}</option>`
        ).join('');

        // Header stats
        $('completed-count').innerText = data.completed_count;
        const status = $('solver-status');
        status.innerHTML = data.solving ? `<span class="spinner"></span>${esc(data.mode)}` : esc(data.mode);
        status.style.color = data.is_solved ? 'var(--success)' : (data.solving ? 'var(--accent)' : 'var(--danger)');
        const note = $('solver-note');
        note.hidden = !data.solver_error;
        note.textContent = data.solver_error ? `Route solver failed (${data.solver_error}); showing nearest strongholds.` : '';

        // My target
        const details = $('target-details');
        const actions = $('target-actions');
        if (!mine) {
            details.textContent = 'Join the run to get your targets.';
            actions.hidden = true;
        } else if (mine.target) {
            details.innerHTML = targetBlock(mine.target);
            actions.hidden = false;
        } else {
            actions.hidden = true;
            details.textContent = data.ring_progress.length === 0
                ? 'Log a ring coordinate to begin nearest-stronghold guidance.'
                : (data.ring_progress.length === 8 ? 'No strongholds left to visit. Nice run!' : 'Waiting for a free stronghold...');
        }

        // Teammates (everyone else, with their targets so nobody doubles up)
        $('team-area').innerHTML = data.players.filter((p) => !mine || p.name !== mine.name).map((p) => `
            <div class="teammate">
                <i class="dot" style="background:${esc(p.color)}"></i>
                <strong>${esc(p.name)}</strong>
                <span>${p.target ? `heading to ${p.target.overworld.x}, ${p.target.overworld.z} (ring ${p.target.ring}, ${Math.round(p.target.distance)} blocks)` : 'no target'}</span>
                <span class="muted">${p.route_remaining} planned stops</span>
            </div>`).join('');

        // Rings
        const found = new Set(data.ring_progress);
        $('ring-progress').innerHTML = Array.from({ length: 8 }, (_, i) => {
            const ring = i + 1, ok = found.has(ring);
            return `<div class="ring ${ok ? 'found' : ''}">Ring ${ring}: ${ok ? 'Found' : 'Pending'}</div>`;
        }).join('');
        $('ring-section').hidden = data.ring_progress.length === 8;

        // Buttons
        $('btn-undo').disabled = !data.can_undo;
        $('btn-replan').disabled = data.ring_progress.length < 8 || data.solving;

        // Log + map
        $('log').innerHTML = data.log.map(formatLog).join('') || '<li>Nothing yet.</li>';
        $('legend').innerHTML = data.players.map((p) =>
            `<span><i class="dot" style="background:${esc(p.color)}"></i>${esc(p.name)}</span>`).join('');
        const img = $('map-image');
        if (img.getAttribute('src') !== data.image_url) img.src = data.image_url;
        $('fun-fact-text').innerText = data.fun_fact ? `Trivia: ${data.fun_fact}` : '';
    }

    // --- events -----------------------------------------------------------
    $('join-form').onsubmit = async (e) => {
        e.preventDefault();
        const name = $('join-name').value.trim();
        const data = await api('/api/players', { name });
        if (data) {
            me = (data.players.find((p) => p.name.toLowerCase() === name.toLowerCase()) || { name }).name;
            localStorage.setItem('ap_player', me);
            $('join-name').value = '';
            render(data, true);
        }
    };

    $('player-select').onchange = (e) => {
        me = e.target.value;
        localStorage.setItem('ap_player', me);
        if (latest) render(latest, true);
    };

    // Actions name the stronghold on screen, so a teammate completing it first
    // (or a double click) can never count it twice.
    function progress(url) {
        const mine = latest && myPlayer(latest);
        if (!mine || !mine.target) return;
        api(url, { player: mine.name, index: mine.target.index });
    }
    $('btn-complete').onclick = () => progress('/api/complete');
    $('btn-skip').onclick = () => progress('/api/skip');

    $('ring-form').onsubmit = async (e) => {
        e.preventDefault();
        const mine = latest && myPlayer(latest);
        const data = await api('/api/ring-stronghold', {
            x: parseInt($('ring-x').value, 10),
            z: parseInt($('ring-z').value, 10),
            player: mine ? mine.name : null,
        });
        if (data) e.target.reset();
    };

    $('reset-paste').oninput = (e) => {
        const match = e.target.value.match(/\btp\s+@s\s+(-?(?:\d+(?:\.\d+)?|\.\d+))\s+(-?(?:\d+(?:\.\d+)?|\.\d+))\s+(-?(?:\d+(?:\.\d+)?|\.\d+))/i);
        if (!match) return;
        const scale = /the_nether/i.test(e.target.value) ? 8 : 1;
        $('reset-x').value = Math.floor(parseFloat(match[1]) * scale);
        $('reset-z').value = Math.floor(parseFloat(match[3]) * scale);
        e.target.value = '';
    };

    $('reset-form').onsubmit = (e) => {
        e.preventDefault();
        const mine = latest && myPlayer(latest);
        if (!mine) return showError('Join the run first');
        api('/api/reset-spawn', {
            player: mine.name,
            x: parseInt($('reset-x').value, 10),
            z: parseInt($('reset-z').value, 10),
        });
    };

    $('count-form').onsubmit = (e) => {
        e.preventDefault();
        const mine = latest && myPlayer(latest);
        api('/api/count', { count: parseInt($('count-value').value, 10), player: mine ? mine.name : null });
    };

    $('btn-undo').onclick = () => {
        const mine = latest && myPlayer(latest);
        api('/api/undo', { player: mine ? mine.name : null });
    };
    $('btn-replan').onclick = () => {
        const mine = latest && myPlayer(latest);
        api('/api/reoptimize', { player: mine ? mine.name : null });
    };

    // Everyone's screen stays in sync by polling; the DOM is only rebuilt when
    // the server's version changes, so typing in a form is never interrupted.
    poll();
    setInterval(poll, POLL_MS);
</script>

</body>
</html>
